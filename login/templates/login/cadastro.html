{% extends "app/base.html" %}
{% block titulo %}Novo Usuário{% endblock %}
{% block conteudo %}
<div class="form-card">
    <h2>Novo usuário</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Criar conta</button>
    </form>
    <div class="links-form"><a href="{% url 'login' %}">Já tenho conta</a></div>
</div>
{% endblock %}
