{% extends "app/base_painel.html" %}
{% block titulo %}Dashboard{% endblock %}
{% block conteudo %}
<h2>Dashboard</h2>
<p class="boas-vindas">Olá, <strong>{{ user.get_full_name|default:user.username }}</strong>
    <span class="selo-perfil">{{ tipo_usuario|upper }}</span></p>
<div class="secoes">
    {% for s in secoes %}
    <a class="secao" href="{{ s.url }}"><div class="ico">{{ s.icone }}</div><h3>{{ s.titulo }}</h3><p>{{ s.descricao }}</p></a>
    {% endfor %}
</div>
{% endblock %}
